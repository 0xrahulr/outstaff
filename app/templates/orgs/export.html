{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-slate-900">Export Data</h1>
            <p class="text-slate-600">Download data for {{ org.name }}</p>
        </div>
        <a href="{{ url_for('orgs.view_org', org_id=org.id) }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <div class="card p-6">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="space-y-4">
                <label class="block text-sm font-medium text-slate-700">Select data to export:</label>

                <div class="space-y-2">
                    <div class="flex items-center">
                        <input id="members" name="data_type" type="radio" value="members" checked
                            class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-600">
                        <label for="members" class="ml-3 block text-sm font-medium text-slate-900">All Members</label>
                    </div>
                    <div class="flex items-center">
                        <input id="expenses" name="data_type" type="radio" value="expenses"
                            class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-600">
                        <label for="expenses" class="ml-3 block text-sm font-medium text-slate-900">Expenses</label>
                    </div>
                    <div class="flex items-center">
                        <input id="leaves" name="data_type" type="radio" value="leaves"
                            class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-600">
                        <label for="leaves" class="ml-3 block text-sm font-medium text-slate-900">Leave Requests</label>
                    </div>
                    <div class="flex items-center">
                        <input id="notes" name="data_type" type="radio" value="notes"
                            class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-600">
                        <label for="notes" class="ml-3 block text-sm font-medium text-slate-900">Team Notes</label>
                    </div>
                    <div class="flex items-center">
                        <input id="activity" name="data_type" type="radio" value="activity"
                            class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-600">
                        <label for="activity" class="ml-3 block text-sm font-medium text-slate-900">Activity Log</label>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="btn btn-primary w-full justify-center">
                    Download CSV
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
